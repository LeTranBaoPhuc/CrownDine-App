version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowndine-image
    container_name: crowndine-app
    restart: always
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USERNAME: crowndine
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

  mysql:
    image: mysql:8.0
    container_name: crowndine_db
    restart: always
    environment:
      MYSQL_DATABASE: crowndine-app
      MYSQL_USER: crowndine
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
volumes:
  mysql_data: